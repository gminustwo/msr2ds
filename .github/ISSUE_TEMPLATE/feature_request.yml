name: Feature request
description: An idea for msr2ds, such as an option, a control, a graphics or sound setting, or support for something.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! msr2ds runs the game's own code, so requests about the PC side (settings, controls, displays, mods) are the easiest to add; changes to the game itself are case by case.

  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: What it should do, and where you'd expect to find it (a launcher tab, the in-game menu, a button, a setting).
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why?
      description: How you'd use it, or what it would fix for you. If another port or emulator (Azahar, for example) does it, say how.

  - type: input
    id: version
    attributes:
      label: msr2ds version
      description: Shown at the bottom of the launcher's Game tab, e.g. "msr-native 2.2.0".
      placeholder: "2.2.0"
